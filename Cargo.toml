[package]
name = "omarchy-hotspot"
version = "0.3.1"
edition = "2024"
description = "Interactive terminal Wi-Fi hotspot manager for Arch Linux (Omarchy), built on create_ap"
license = "MIT"
repository = "https://github.com/DCT-Berinyuy/omarchy-hotspot"
readme = "README.md"

[dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
dialoguer = "0.12.0"
# Only PNG output is needed for the QR code image.
image = { version = "0.25.10", default-features = false, features = ["png"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }

[profile.release]
# Smaller download for low-bandwidth users; panic messages are unaffected.
strip = true
