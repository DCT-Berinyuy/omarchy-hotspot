name: Release

on:
  push:
    tags: ["v*"]
  # Dry run when this workflow changes: build and package only, nothing is published.
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Check the tag matches the Cargo.toml version
        if: github.ref_type == 'tag'
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir dist
          cp target/release/omarchy-hotspot dist/
          cd dist
          sha256sum omarchy-hotspot > omarchy-hotspot.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: omarchy-hotspot
          path: dist/
          if-no-files-found: error

  publish:
    name: Create draft release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: omarchy-hotspot
          path: dist

      # Lets users check the binary they run as root was built here:
      # gh attestation verify omarchy-hotspot --repo DCT-Berinyuy/omarchy-hotspot
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/omarchy-hotspot

      # A draft gives the maintainer a chance to edit the notes before publishing.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/omarchy-hotspot dist/omarchy-hotspot.sha256
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
          --draft
